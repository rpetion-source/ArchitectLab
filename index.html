<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data & AI Governance Architect Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF4FF;--surface:#FFFFFF;--surface-2:#F1EDFF;--ink:#1E1B3A;--muted:#5D5A7A;--line:#CFC9EE;--outline:#1E1B3A;--shadow:#1E1B3A;
  --accent:#7C4DFF;--accent-2:#FFC93C;--allow:#18B57A;--deny:#FF4D5E;--cond:#FF9F1C;--na:#A3A1B8;--obs:#2F86FF;--indet:#A35CFF;
  --f-data:#1E1B3A;--f-api:#2F86FF;--f-auth:#00B8A9;--f-policy:#FF9F1C;--f-tele:#8C89A6;--f-gov:#B8B4D6;
  --k-actor:#2F86FF;--k-identity:#00B8A9;--k-agent:#7C4DFF;--k-gov:#FF9F1C;--k-connector:#00A3FF;--k-source:#18B57A;--k-protect:#FF4D8D;--k-audit:#8C89A6;--k-output:#5B5BFF;--k-external:#FF6B35;
  --c1:#FF6B9D;--c2:#FFC93C;--c3:#3DDC97;--c4:#7C4DFF;--c5:#2F86FF;--c6:#FF8C42;--c7:#00C2D1;--c8:#B66DFF;
  --display:"Fredoka","Nunito",system-ui,sans-serif;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17153A;--surface:#221F4D;--surface-2:#2C2860;--ink:#F4F1FF;--muted:#B5B1DA;--line:#3F3A7A;--outline:#0B0920;--shadow:#07061A;
  --accent:#9D7BFF;--accent-2:#FFD25E;--allow:#3DDC97;--deny:#FF6B7A;--cond:#FFB547;--na:#8E8AB3;--obs:#5AA8FF;--indet:#C08CFF;
  --f-data:#F4F1FF;--f-api:#5AA8FF;--f-auth:#2FE0CF;--f-policy:#FFB547;--f-tele:#9E9AC4;--f-gov:#5A5596;
  --k-actor:#5AA8FF;--k-identity:#2FE0CF;--k-agent:#9D7BFF;--k-gov:#FFB547;--k-connector:#4CC3FF;--k-source:#3DDC97;--k-protect:#FF6FA8;--k-audit:#A6A3C9;--k-output:#8A8AFF;--k-external:#FF8A5C;
  --c1:#FF7FAE;--c2:#FFD25E;--c3:#4FE3A6;--c4:#9D7BFF;--c5:#5AA8FF;--c6:#FFA05E;--c7:#2FD9E6;--c8:#C590FF;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17153A;--surface:#221F4D;--surface-2:#2C2860;--ink:#F4F1FF;--muted:#B5B1DA;--line:#3F3A7A;--outline:#0B0920;--shadow:#07061A;
  --accent:#9D7BFF;--accent-2:#FFD25E;--allow:#3DDC97;--deny:#FF6B7A;--cond:#FFB547;--na:#8E8AB3;--obs:#5AA8FF;--indet:#C08CFF;
  --f-data:#F4F1FF;--f-api:#5AA8FF;--f-auth:#2FE0CF;--f-policy:#FFB547;--f-tele:#9E9AC4;--f-gov:#5A5596;
  --k-actor:#5AA8FF;--k-identity:#2FE0CF;--k-agent:#9D7BFF;--k-gov:#FFB547;--k-connector:#4CC3FF;--k-source:#3DDC97;--k-protect:#FF6FA8;--k-audit:#A6A3C9;--k-output:#8A8AFF;--k-external:#FF8A5C;
  --c1:#FF7FAE;--c2:#FFD25E;--c3:#4FE3A6;--c4:#9D7BFF;--c5:#5AA8FF;--c6:#FFA05E;--c7:#2FD9E6;--c8:#C590FF;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--muted)}
.bar .spacer{flex:1}
.notice{font-size:12px;color:var(--muted);max-width:360px;text-align:right}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--surface-2)}
/* ---------- Galerie ---------- */
.gallery{max-width:1200px;margin:0 auto;padding:28px 20px 64px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:34px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,5.2vw,60px);line-height:.98;letter-spacing:-.03em;margin:0 0 14px}
.hero p{color:var(--muted);max-width:52ch;margin:0 0 18px;font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.stat b{font-family:var(--display);font-size:22px;display:block;line-height:1}
.stat span{font-size:12.5px;color:var(--muted)}
.hero-art{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px}
.hero-art svg{display:block;width:100%;height:auto}
.progress{display:flex;align-items:center;gap:12px;margin:0 0 18px;font-size:14px}
.progress .track{flex:1;max-width:320px;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress .fill{height:100%;background:linear-gradient(90deg,var(--allow),var(--accent));border-radius:99px;transition:width .6s}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.card.live{cursor:pointer;transition:transform .15s,box-shadow .15s}
.card.live:hover{transform:translateY(-3px);box-shadow:0 10px 30px -18px var(--accent)}
.card .art{height:112px;margin:-18px -18px 4px;display:block}
.card h2{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em;margin:0;line-height:1.1}
.card q{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.card .foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.diff-dots{display:inline-flex;gap:3px;vertical-align:middle}.diff-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.diff-dots i.on{background:var(--cond)}
.cta{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:8px 13px;font-weight:600;white-space:nowrap}
.soon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:22px}
.soon{background:transparent;border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:13.5px;color:var(--muted)}
.soon b{color:var(--ink);display:block;margin-bottom:4px}
.section-title{font-family:var(--display);font-weight:800;font-size:22px;margin:30px 0 4px}
/* ---------- Canvas ---------- */
.scen-head{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.scen-head h1{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.01em;white-space:nowrap}
.scen-head q{color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.canvas{display:grid;grid-template-columns:290px minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr) minmax(0,auto);gap:1px;background:var(--line);height:calc(100dvh - 116px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:580px}
.panel{background:var(--surface);padding:14px 16px;overflow:auto}
.left{grid-column:1;grid-row:1/3}
.center{grid-column:2;grid-row:1;display:flex;flex-direction:column;padding:0;background:var(--bg);overflow:hidden}
.right{grid-column:3;grid-row:1/3;padding:0;display:flex;flex-direction:column}
.bottom{grid-column:2;grid-row:2;padding:10px 14px;max-height:27vh}
.panel h3{font-size:12.5px;color:var(--muted);font-weight:600;margin:16px 0 7px}
.panel h3:first-child{margin-top:0}
.presets{display:grid;gap:6px}
.presets button{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 9px;font-size:13px;line-height:1.3}
.presets button .k{flex:none;width:22px;height:22px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:12px}
.presets button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.presets button[aria-pressed="true"] .k{background:var(--accent);color:#fff}
.field{display:grid;gap:3px;margin-bottom:8px}
.field label{font-size:12.5px;color:var(--muted)}
.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;width:100%}
.field.changed select{border-color:var(--cond);box-shadow:0 0 0 2px color-mix(in srgb,var(--cond) 25%,transparent)}
.grp{font-size:12px;font-weight:700;margin:12px 0 6px}
table.mini{width:100%;border-collapse:collapse;font-size:12.5px}
table.mini td,table.mini th{text-align:left;padding:4px;border-bottom:1px solid var(--line);vertical-align:top}
table.mini th{color:var(--muted);font-weight:500}
details summary{cursor:pointer;font-size:13px;font-weight:600;margin:12px 0 6px}
.rule-li{font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)}
.toolbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.toolbar .sep{flex:none;width:1px;height:22px;background:var(--line);margin:0 4px}
.tb{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 11px;font-size:13px}
.tb.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;min-width:92px}
.tb:disabled{opacity:.4;cursor:default}
.seg{flex:none;display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 9px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface-2);font-weight:700}
.filters{display:flex;gap:12px;padding:6px 12px;font-size:12px;color:var(--muted);background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.filters label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.narr{display:flex;align-items:center;gap:10px;margin:10px 12px 0;padding:9px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;min-height:44px}
.narr .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--display);color:#fff;background:var(--na)}
.narr .t{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.diff{margin:8px 12px 0;padding:8px 12px;border:1px solid var(--cond);border-radius:12px;background:color-mix(in srgb,var(--cond) 10%,var(--surface));font-size:13px}
.diff[hidden]{display:none}
.diff button{float:right;border:0;background:none;color:var(--muted);font-size:12.5px;padding:0 0 0 8px}
.graph-wrap{position:relative;flex:1;min-height:200px}
.graph-wrap:fullscreen{background:var(--bg)}
#graph{width:100%;height:100%;display:block;touch-action:none;cursor:grab;position:absolute;inset:0}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:9px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);padding:6px 12px;background:var(--surface);border-top:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.disclaimer{font-size:11.5px;color:var(--muted);padding:5px 12px;background:var(--surface);border-top:1px solid var(--line)}
/* Graphe */
.node rect.box{fill:var(--surface);stroke:var(--line);stroke-width:1.25}
.node text.lb{fill:var(--ink);font-size:14px;font-weight:700}
.node text.sub{fill:var(--muted);font-size:11.5px}
.node{cursor:pointer}
.node:focus{outline:none}.node:focus-visible rect.box{stroke:var(--accent);stroke-width:2.5}
.node.dim{opacity:.35}
.node.cur .ring{animation:ring 1.3s ease-out infinite}
@keyframes ring{from{opacity:.55;transform:scale(1)}to{opacity:0;transform:scale(1.18)}}
.node .ring{transform-box:fill-box;transform-origin:center;fill:none;stroke-width:3}
.node.denied rect.box{animation:shake .45s 1}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.edge path.line{fill:none}
.edge text{font-size:11px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.edge.dim{opacity:.16}
.edge.cur path.line{stroke-width:2.8}
@media (prefers-reduced-motion:reduce){.node.cur .ring,.node.denied rect.box{animation:none}.packet{display:none}}
/* Droite */
.rtabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.rtabs button{flex:1;border:0;background:none;padding:10px 4px;font-size:13.5px;border-bottom:2px solid transparent;color:var(--muted)}
.rtabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink);font-weight:700}
.rtabs .cnt{display:inline-block;margin-left:4px;font-size:11px;background:var(--surface-2);border-radius:99px;padding:0 6px}
.rbody{padding:14px 16px;overflow:auto;flex:1}
.title-lg{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15;letter-spacing:-.01em}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:color-mix(in srgb,currentColor 12%,transparent);white-space:nowrap}
.d-allow{color:var(--allow)}.d-deny{color:var(--deny)}.d-conditional{color:var(--cond)}.d-not-applicable{color:var(--na)}.d-observed{color:var(--obs)}.d-indeterminate{color:var(--indet)}
.risk{font-size:12px;color:var(--muted)}
.risk.high,.risk.critical{color:var(--deny);font-weight:700}
.dl{margin:0;font-size:13.5px}
.dl dt{font-size:12.5px;color:var(--muted);margin-top:10px}
.dl dd{margin:2px 0 0}
.dl ul{margin:0;padding-left:18px}
.match{border:1px solid var(--line);border-left:4px solid var(--na);border-radius:10px;padding:9px 10px;margin:8px 0;font-size:13.5px}
.match .hd{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px}
.match .src{font-size:12px;margin-top:6px;color:var(--muted)}
/* Récit */
.story{display:flex;flex-direction:column;gap:8px}
.bub{max-width:88%;padding:8px 11px;border-radius:14px;font-size:13.5px;background:var(--surface-2);position:relative}
.bub small{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.bub.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.bub.user small{color:color-mix(in srgb,#fff 75%,transparent)}
.bub.agent,.bub.tool{align-self:flex-start;border-bottom-left-radius:4px}
.bub.human{align-self:center;border:1px dashed var(--line);background:transparent}
.bub.system{align-self:stretch;max-width:none;border-radius:10px}
.bub.attacker{align-self:flex-start;background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--deny) 12%,var(--surface)) 0 8px,color-mix(in srgb,var(--deny) 5%,var(--surface)) 8px 16px);border:1px solid var(--deny)}
.bub.t-allow{box-shadow:inset 3px 0 0 var(--allow)}.bub.t-deny{box-shadow:inset 3px 0 0 var(--deny)}.bub.t-warn{box-shadow:inset 3px 0 0 var(--cond)}
.bub.user.t-neutral{box-shadow:none}
.bub.t-attack{box-shadow:inset 3px 0 0 var(--deny)}.bub.t-info{box-shadow:inset 3px 0 0 var(--accent)}
.dtable{border-collapse:separate;border-spacing:0;font-size:12px;width:100%;margin-top:6px}
.dtable th,.dtable td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.dtable th{font-size:11.5px;color:var(--muted)}
.dtable th.sens::after{content:" ●";color:var(--k-protect)}
.dtable .hid{color:transparent;background:repeating-linear-gradient(-45deg,var(--surface-2) 0 5px,transparent 5px 10px);user-select:none}
.dtable tr.rhid td{opacity:.35}
.dtable .ok{background:color-mix(in srgb,var(--allow) 9%,transparent)}
.twrap{overflow-x:auto}
/* Défis */
.mission{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px}
.mission .ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800}
.mission.done{border-color:var(--allow);background:color-mix(in srgb,var(--allow) 7%,var(--surface))}
.mission.done .ck{background:var(--allow);border-color:var(--allow);color:#fff}
.mission b{display:block;font-size:13.5px}
.mission p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
/* Bas */
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px}
.tstep{border:1px solid var(--line);border-top:4px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 7px;text-align:left;font-size:12px;min-width:0}
.tstep b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tstep span{color:var(--muted)}
.tstep.cur{box-shadow:0 0 0 2px var(--accent)}
.tstep.future{opacity:.5}
.verdict-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:9px;font-size:13.5px}
.verdict{font-family:var(--display);font-weight:800;font-size:20px}
/* Toast + confettis */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);z-index:20;background:var(--surface);border:2px solid var(--allow);border-radius:16px;padding:12px 16px;max-width:min(440px,92vw);box-shadow:0 18px 40px -20px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
.toast.on{transform:translate(-50%,0)}
.toast b{font-family:var(--display);font-size:17px;display:block;color:var(--allow)}
.toast p{margin:4px 0 0;font-size:13.5px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:19;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.toast{transition:none}}
/* ================= Thème cartoon ================= */
body{background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--accent) 16%,transparent) 1.4px,transparent 1.6px);background-size:22px 22px}
.bar{border-bottom:3px solid var(--outline)}
.brand b,.panel h3,.grp,.title-lg,.verdict,.section-title,.scen-head h1,.card h2,.hero h1,.stat b,.toast b,.mission b,.rtabs button,.tabs button{font-family:var(--display)}
.icon-btn,.tb,.seg,.zoom button,.field select{border:2.5px solid var(--outline);border-radius:12px;box-shadow:3px 3px 0 var(--shadow);font-weight:700}
.tb:active,.cta:active,.icon-btn:active,.zoom button:active,.presets button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.tb.primary,.cta{background:var(--accent);color:#fff;border:2.5px solid var(--outline);box-shadow:4px 4px 0 var(--shadow);border-radius:14px;font-family:var(--display);font-weight:600;letter-spacing:.01em}
.seg{overflow:hidden}.seg button{font-weight:700}

// ---------------------------------------------------------------- Graphe
const NW = 180, NH = 64, COL = 214, ROW = 104, PAD = 40;
function layout(facts) {
  const vis = SC().nodes.filter((n) => !n.visibleWhen || evaluateCondition(n.visibleWhen, facts));
  const rows = new Map();
  vis.forEach((n) => { if (n.row === undefined) { const k = rows.get(n.layer) ?? 0; n.row = k; rows.set(n.layer, k + 1); } });
  const usedRows = [...new Set(vis.map((n) => n.row))].sort((a, b) => a - b);
  const rowIndex = (r) => usedRows.indexOf(r); // les rangées vides (brique masquée) se referment
  const pos = {};
  vis.forEach((n) => { pos[n.id] = { x: PAD + n.layer * COL, y: PAD + 20 + rowIndex(n.row) * ROW }; });
  const w = PAD * 2 + Math.max(...vis.map((n) => n.layer)) * COL + NW;
  const h = PAD * 2 + 20 + usedRows.length * ROW - (ROW - NH);
  const edges = SC().edges.filter((e) => pos[e.from] && pos[e.to] && (!e.visibleWhen || evaluateCondition(e.visibleWhen, facts)));
  return { vis, pos, edges, w, h };
}
function edgePath(a, b) {
  if (a.x === b.x) {
    const down = b.y > a.y, x = a.x + NW / 2, y1 = down ? a.y + NH : a.y, y2 = down ? b.y : b.y + NH;
    return { d: `M${x} ${y1}V${y2}`, lx: x + 6, ly: (y1 + y2) / 2 + 4, anchor: "start" };
  }
  const fwd = b.x > a.x, x1 = fwd ? a.x + NW : a.x, x2 = fwd ? b.x : b.x + NW, y1 = a.y + NH / 2, y2 = b.y + NH / 2, mx = (x1 + x2) / 2;
  return { d: `M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`, lx: mx, ly: (y1 + y2) / 2 - 7, anchor: "middle" };
}
function nodeStates() {
  const s = {};
  st.result.steps.forEach((step, i) => { if (i <= st.idx) step.nodeIds.forEach((n) => { s[n] = { d: step.decision, cur: i === st.idx }; }); });
  return s;
}
function edgeStates() {
  const s = {};
  st.result.steps.forEach((step, i) => { if (i <= st.idx && step.decision !== "not-applicable") step.edgeIds.forEach((e) => { s[e] = { d: step.decision, cur: i === st.idx }; }); });
  return s;
}
function renderGraph() {
  const Lg = layout(st.result.facts), svg = $("#graph");
  st.fit = { x: 0, y: 0, w: Lg.w, h: Lg.h };
  if (!st.vb) st.vb = { ...st.fit };
  const box = svg.getBoundingClientRect();
  if (st.follow && box.width && box.width < 640) {
    const step = st.idx >= 0 ? st.result.steps[st.idx] : null;
    const ids = (step ? step.nodeIds : SC().steps[0].nodeIds).filter((id) => Lg.pos[id]);
    if (ids.length) {
      const xs = ids.map((id) => Lg.pos[id].x), ys = ids.map((id) => Lg.pos[id].y);
      const cx = (Math.min(...xs) + Math.max(...xs) + NW) / 2, cy = (Math.min(...ys) + Math.max(...ys) + NH) / 2;
      const w = Math.max(Math.max(...xs) - Math.min(...xs) + NW + 50, 420), h = w * box.height / box.width;
      st.vb = { x: cx - w / 2, y: cy - h / 2, w, h };
    }
  }
  const ns = nodeStates(), es = edgeStates(), started = st.idx >= 0;
  const markers = FLOWS.map((f) => `<marker id="m-${f.k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(${f.v})"/></marker>`).join("");
  const edges = Lg.edges.filter((e) => st.flows.has(e.kind)).map((e) => {
    const f = FLOWS.find((x) => x.k === e.kind), p = edgePath(Lg.pos[e.from], Lg.pos[e.to]), s1 = es[e.id];
    return `<g class="edge${started && !s1 ? " dim" : ""}${s1?.cur ? " cur" : ""}">
      <path class="line" d="${p.d}" stroke="var(${f.v})" stroke-width="${e.kind === "governance" ? 1.6 : 2.6}" ${f.dash ? `stroke-dasharray="${f.dash}"` : ""} marker-end="url(#m-${f.k})"/>
      ${s1?.cur ? `<circle class="packet" r="8" fill="var(${DEC_VAR[s1.d]})" stroke="var(--outline)" stroke-width="2.5"><animateMotion dur="${(1.3 / st.speed).toFixed(2)}s" repeatCount="indefinite" path="${p.d}"/></circle>` : ""}
      <text x="${p.lx}" y="${p.ly}" text-anchor="${p.anchor}">${esc(e.label)}</text></g>`;
  }).join("");
  const nodes = Lg.vis.map((n) => {
    const p = Lg.pos[n.id], s = ns[n.id], sel = st.view?.type === "node" && st.view.id === n.id, k = KIND[n.kind] ?? KIND.actor;
    const col = s ? `var(${DEC_VAR[s.d]})` : "var(--shadow)";
    const label = n.label.length > 16 ? n.label.slice(0, 15) + "…" : n.label;
    const prod = n.product.length > 22 ? n.product.slice(0, 21) + "…" : n.product;
    const cx = p.x + 30, cy = p.y + NH / 2;
    const portrait = n.kind === "actor" ? faceG(n.id + SC().id, cx, cy, 19) : n.kind === "agent" ? robotG(cx, cy + 2, 18, s?.d === "deny" ? "worried" : "smile") : n.kind === "external" && SC().id !== "external-model" ? attackerG(cx, cy, 19)
      : `<circle cx="${cx}" cy="${cy}" r="19" fill="var(--surface)" stroke="var(--outline)" stroke-width="2"/><g transform="translate(${cx - 10} ${cy - 10})"><path d="${k.d}" fill="none" stroke="var(${k.v})" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>`;
    const shadowOff = s?.cur ? 7 : 5;
    return `<g class="node${started && !s ? " dim" : ""}${s?.cur ? " cur" : ""}${s?.cur && s.d === "deny" ? " denied" : ""}" data-node="${n.id}" tabindex="0" role="button" aria-label="${esc(n.label)} — ${esc(n.product)}${s ? ", " + DEC[s.d] : ""}">
      <rect x="${p.x + shadowOff}" y="${p.y + shadowOff}" width="${NW}" height="${NH}" rx="18" fill="${col}"/>
      <rect class="box" x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="18" style="fill:color-mix(in srgb,var(${k.v}) 18%,var(--surface));stroke:${sel ? "var(--accent)" : "var(--outline)"};stroke-width:${sel ? 3.5 : 2.6}${n.necessity === "optional" ? ";stroke-dasharray:7 5" : ""}"/>
      ${portrait}
      <text class="lb" x="${p.x + 56}" y="${p.y + 28}">${esc(label)}</text>
      <text class="sub" x="${p.x + 56}" y="${p.y + 46}">${esc(prod)}</text>
      ${s ? `<circle cx="${p.x + NW - 2}" cy="${p.y + 2}" r="13" fill="${col}" stroke="var(--outline)" stroke-width="2.5"/><text x="${p.x + NW - 2}" y="${p.y + 7.5}" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">${DEC_GLYPH[s.d]}</text>` : ""}
      ${s?.cur && s.d === "deny" ? burstG(p.x + NW / 2, p.y - 22, "STOP !", "var(--deny)") : ""}
      ${s?.cur && s.d === "indeterminate" ? burstG(p.x + NW / 2, p.y - 22, "?!", "var(--indet)") : ""}
    </g>`;
  }).join("");
  svg.innerHTML = `<defs>${markers}</defs>${edges}${nodes}`;
  applyViewBox();
  svg.querySelectorAll("[data-node]").forEach((g) => {
    const open = () => openNode(g.dataset.node);
    g.addEventListener("click", open);
    g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); open(); } });
  });
}
function applyViewBox() { const v = st.vb; $("#graph").setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`); }

// ---------------------------------------------------------------- Parcours guidé : textes simples
const isMobile = () => matchMedia("(max-width:980px)").matches;
const scrollToEl = (sel, always) => { if (always || isMobile()) document.querySelector(sel)?.scrollIntoView({ behavior: "smooth", block: "start" }); };
const VERDICT = {
  ok: ["✅", "Ça passe, et c’est normal", "La demande est servie, dans les règles."],
  leak: ["🚨", "Fuite !", "Ça passe alors que ça ne devrait pas."],
  block: ["🛡️", "Bloqué : la sécurité fonctionne", "La demande non autorisée est arrêtée."],
  oops: ["😬", "Bloqué… à tort", "Une demande légitime est refusée : gênant pour le métier."],
  unknown: ["🤔", "Impossible de trancher", "La documentation ne permet pas de conclure."],
};
const SHORT = { ok: "✅ Ça passe", leak: "🚨 Fuite", block: "🛡️ Bloqué", oops: "😬 Bloqué à tort", unknown: "🤔 Indéterminé" };
function verdictKind(r) {
  if (r.outcome === "indeterminate") return "unknown";
  if (r.outcome === "obtained") return r.objective.met === false ? "leak" : "ok";
  return r.objective.met === false ? "oops" : "block";
}
const personaRole = (name) => SC().personas.find((p) => p.name === name)?.role ?? "";

// ---------------------------------------------------------------- Fil d'étapes
function renderStepper() {
  const cur = { ask: 0, run: 1, verdict: 2 }[st.phase];
  const items = [["ask", "La demande"], ["run", "Le trajet"], ["verdict", "Le verdict"], ["whatif", "Et si… ?"]];
  $("#stepper").innerHTML = items.map(([id, label], i) => {
    const on = i === cur || (st.phase === "verdict" && i === 3), isDone = i < cur, off = i >= 2 && st.phase !== "verdict";
    return `${i ? '<span class="arrow" aria-hidden="true">→</span>' : ""}<button type="button" data-goto="${id}" class="${on ? "on" : ""}${isDone ? " done" : ""}"${off ? " disabled" : ""}${on ? ' aria-current="step"' : ""}><span class="num">${isDone ? "✓" : i + 1}</span>${label}</button>`;
  }).join("");
  $("#stepper").querySelectorAll("[data-goto]").forEach((b) => b.onclick = () => {
    const g = b.dataset.goto;
    if (g === "ask") { stop(); st.phase = "ask"; st.idx = -1; st.view = null; renderAll(); scrollToEl("#ask", true); }
    else if (g === "run") launch();
    else { st.view = null; renderSide(); scrollToEl(g === "whatif" ? "#whatifs" : "#side", true); }

}

// ---------------------------------------------------------------- 1. La demande

// ---------------------------------------------------------------- 2. Le trajet : narration et chronologie
function renderNarr() {
  const el = $("#narr"), n = st.result.steps.length;
  const bot = (mood) => `<span class="bot">${avatarSvg(robotG(20, 21, 15, mood), 46)}</span>`;
  if (st.idx < 0) {
    el.innerHTML = `${bot("smile")}<span class="t">Salut ! Appuie sur <b>Lancer la demande</b> : je te montre où passe la requête, et qui la laisse passer… ou pas.</span>`;
    return;
  }
  const s = st.result.steps[st.idx];
  const rank = { deny: 5, indeterminate: 4, conditional: 3, allow: 2, observed: 1, "not-applicable": 0 };
  const m = [...s.matched].sort((a, b) => rank[b.decision] - rank[a.decision])[0];
  const mood = s.decision === "deny" ? "worried" : s.decision === "indeterminate" ? "wow" : "smile";
  el.innerHTML = `${bot(mood)}<span class="n" style="background:var(${DEC_VAR[s.decision]});color:#fff;width:auto;padding:0 8px;border-radius:999px">${st.idx + 1}/${n}</span>
    <span class="t"><b>${esc(s.title)}</b> : ${esc(m ? m.rationale : s.skippedBecause ?? "")}</span>
    <span class="ctrl"><button type="button" id="nPrev" aria-label="Étape précédente"${st.idx <= 0 ? " disabled" : ""}>◀</button><button type="button" id="nNext" aria-label="Étape suivante"${st.idx >= n - 1 ? " disabled" : ""}>▶</button></span>`;
  $("#nPrev").onclick = () => { stop(); go(st.idx - 1); };
  $("#nNext").onclick = () => { stop(); go(st.idx + 1); };
}
function renderTimeline() {
  const r = st.result;
  $("#timeline").innerHTML = r.steps.map((s, i) => `<button type="button" class="tstep${i === st.idx ? " cur" : ""}${st.idx >= i ? " done" : ""}${st.idx >= 0 && i > st.idx ? " future" : ""}" data-step="${i}" style="--sc:var(${DEC_VAR[s.decision]});border-top-color:${st.idx >= i ? `var(${DEC_VAR[s.decision]})` : "var(--line)"}"><b>${i + 1}. ${esc(s.title)}</b><span>${st.idx >= i ? DEC_GLYPH[s.decision] + " " + DEC[s.decision] : "à venir"}</span></button>`).join("");

function howToBox() {

function verdictCard() {
  const r = st.result, k = verdictKind(r), [ico, title, sub] = VERDICT[k];
  const all = r.steps.flatMap((s) => s.matched);
  const decisive = r.decisiveRuleId ? all.find((m) => m.ruleId === r.decisiveRuleId) : null;
  const weak = all.filter((m) => RR[m.risk] >= 3).sort((a, b) => RR[b.risk] - RR[a.risk])[0];
  const key = k === "leak" || k === "ok" ? weak : decisive ?? weak;
  const stepIdx = key ? r.steps.findIndex((s) => s.matched.some((m) => m.ruleId === key.ruleId)) : -1;
  const who = key ? `<div><div class="tag">${k === "leak" || k === "ok" ? "Le point faible" : "Qui a décidé ?"}</div><b>${esc(CTRL[key.controlKind])}</b> · ${esc(key.product)}<br>${esc(key.rationale)}<div class="risk" style="margin-top:4px">${refLink(key.ref)}</div>${stepIdx >= 0 ? `<button class="linkish" type="button" data-open-step="${stepIdx}">Voir l’étape ${stepIdx + 1} en détail</button>` : ""}</div>` : "";

  return `<div class="box verdict-card v-${k}"><div class="vhead"><span class="big" aria-hidden="true">${ico}</span><div><b>${title}</b><span>${sub}</span></div></div>
    <div class="vbody">${cmp}<div>${esc(r.objective.explanation)}</div>${who}${risks}</div></div>`;
}

function renderNode(id) {

  const list = (a) => a.length ? `<ul>${a.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : "—";
  return `<div style="display:flex;gap:10px;align-items:center">${`<span style="display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(${(KIND[n.kind] ?? KIND.actor).v}) 14%,transparent)">${icon(n.kind, 22)}</span>`}<div><div class="title-lg">${esc(n.product)}</div><div class="risk">${esc(n.label)} · ${NEED[n.necessity]}</div></div></div>
    <dl class="dl"><dt>Pourquoi cette brique ?</dt><dd>${esc(d.why)}</dd><dt>Responsabilité</dt><dd>${esc(d.responsibility)}</dd>
    <dt>Données reçues</dt><dd>${list(d.inputs)}</dd><dt>Données transmises</dt><dd>${list(d.outputs)}</dd>
    <dt>Identités impliquées</dt><dd>${list(d.identities)}</dd><dt>Droits nécessaires</dt><dd>${list(d.rights)}</dd>
    <dt>Contrôles applicables</dt><dd>${list(d.controls)}</dd><dt>Limites à connaître</dt><dd>${list(d.limits)}</dd>
    <dt>Avant / après</dt><dd>${esc(prev.join(", ") || "—")} → <b>${esc(n.label)}</b> → ${esc(next.join(", ") || "—")}</dd>
    <dt>Prérequis et licences</dt><dd>${list(d.prerequisites)}</dd>
    <dt>Décisions dans cette simulation</dt><dd>${touching.length ? touching.map((x) => `${esc(x.title)} : ${badge(x.decision)}`).join("<br>") : "—"}</dd>
    <dt>Sources officielles</dt><dd>${d.refs.length ? `<ul>${d.refs.map((x) => `<li>${refLink(x)}</li>`).join("")}</ul>` : "—"}</dd></dl>`;
}
function renderStep(i) {
  const s = st.result.steps[i], def = SC().steps.find((x) => x.id === s.stepId);
  return `<div class="risk">Étape ${i + 1} sur ${st.result.steps.length}</div>
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div class="title-lg">${esc(s.title)}</div>${badge(s.decision)}</div>
    <p class="risk" style="margin:4px 0 0">${esc(def.description)} · risque ${RISK[s.risk]}</p>
    ${s.skippedBecause ? `<div class="match">${esc(s.skippedBecause)}</div>` : ""}
    ${s.matched.map((m) => `<div class="match" style="border-left-color:var(${DEC_VAR[m.decision]})"><div class="hd"><b>${m.ruleId} · ${esc(CTRL[m.controlKind])}</b>${badge(m.decision)}</div>
      ${esc(m.rationale)}<div class="src">${esc(m.product)} · confiance ${CONF[m.confidence]} · <span class="risk ${m.risk}">risque ${RISK[m.risk]}</span><br>${refLink(m.ref)}</div></div>`).join("")}
    <p class="risk">Touchez une brique du graphe pour voir sa fiche.</p>`;
}

// ---------------------------------------------------------------- Réglages avancés (tiroir)
function openDrawer() { $("#drawer").hidden = false; renderDrawer(); $("#drawerClose").focus(); }
function closeDrawer() { $("#drawer").hidden = true; }
function renderDrawer() {
  const s = SC(), groups = [...new Set(s.parameters.map((p) => p.group))];
  $("#drawerBody").innerHTML = `<p class="risk" style="margin-top:0">Chaque changement recalcule immédiatement le verdict, comparé à la situation précédente.</p>
    ${groups.map((g) => `<div class="grp">${esc(g)}</div>` + s.parameters.filter((p) => p.group === g).map((p) => `<div class="field"><label for="p-${p.id}">${esc(p.label)}</label>
      <select id="p-${p.id}" data-param="${p.id}">${p.options.map((o) => `<option value="${o.value}"${st.params[p.id] === o.value ? " selected" : ""}>${esc(o.label)}</option>`).join("")}</select></div>`).join("")).join("")}
    <h3>Affichage</h3>
    <div class="field"><label>Vitesse de l’animation</label><span class="seg" role="group" aria-label="Vitesse">${[["0.5", "Lente"], ["1", "Normale"], ["2", "Rapide"]].map(([v, l]) => `<button type="button" data-speed="${v}" aria-pressed="${Number(v) === st.speed}">${l}</button>`).join("")}</span></div>
    <div class="field"><label>Types de flux affichés</label>${FLOWS.map((f) => `<label style="display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink)"><input type="checkbox" data-flow="${f.k}"${st.flows.has(f.k) ? " checked" : ""}><svg width="26" height="8" aria-hidden="true"><line x1="0" y1="4" x2="26" y2="4" stroke="var(${f.v})" stroke-width="2.5" ${f.dash ? `stroke-dasharray="${f.dash}"` : ""}/></svg>${f.label}</label>`).join("")}</div>
    <h3>Acteurs</h3><table class="mini"><tr><th>Personne</th><th>Rôle</th></tr>${s.personas.map((p) => `<tr><td>${esc(p.name)}</td><td>${esc(p.role)}</td></tr>`).join("")}</table>
    <h3>Données</h3><table class="mini"><tr><th>Élément</th><th>Sensibilité</th></tr>${s.documents.map((d) => `<tr><td>${esc(d.title)}<br><span class="risk">${esc(d.library)}</span></td><td>${esc(d.label)}</td></tr>`).join("")}</table>
    <details><summary>Règles de sécurité (${s.rules.length})</summary>${s.rules.map((r) => `<div class="rule-li"><b>${r.id}</b> v${r.version} · ${esc(r.description)} <span class="risk">confiance ${CONF[r.confidence]}</span></div>`).join("")}</details>
    <p class="risk">Contexte : ${esc(s.businessContext)}</p>`;
  $("#drawerBody").querySelectorAll("[data-param]").forEach((el) => el.onchange = () => setParams({ ...st.params, [el.dataset.param]: el.value }, null, false));
  $("#drawerBody").querySelectorAll("[data-speed]").forEach((b) => b.onclick = () => { st.speed = Number(b.dataset.speed); renderDrawer(); renderGraph(); });
  $("#drawerBody").querySelectorAll("[data-flow]").forEach((c) => c.onchange = () => { c.checked ? st.flows.add(c.dataset.flow) : st.flows.delete(c.dataset.flow); renderGraph(); });
}

// ---------------------------------------------------------------- Défis : récompense
function award() {
  if (st.phase !== "verdict") return;
  const fresh = SC().missions.filter((m) => !done.has(m.id) && missionAchieved(st.result, m));
  if (!fresh.length) return;
  fresh.forEach((m) => done.add(m.id)); saveDone();
  const m = fresh[0], t = $("#toast");
  t.innerHTML = `<b>Défi relevé !</b><p>${esc(m.title)}</p><p class="risk">${esc(m.lesson)}</p>`;
  t.classList.add("on"); clearTimeout(award.t); award.t = setTimeout(() => t.classList.remove("on"), 5200);
  const c = $("#confetti"), colors = ["--allow", "--accent", "--cond", "--k-protect", "--k-agent"];
  c.innerHTML = Array.from({ length: 36 }, (_, i) => `<i style="left:${(i * 97) % 100}%;background:var(${colors[i % colors.length]});animation-delay:${(i % 9) * 0.06}s"></i>`).join("");
  setTimeout(() => { c.innerHTML = ""; }, 2200);
  renderHead(); renderSide();
}

// ---------------------------------------------------------------- Déroulé
function renderAll() { renderStepper(); renderAsk(); renderGraph(); renderNarr(); renderTimeline(); renderSide(); }
function go(i) {
  st.idx = Math.max(-1, Math.min(i, last()));
  if (st.view?.type === "step") st.view = { type: "step", idx: Math.max(0, st.idx) };
  if (st.idx >= last() && st.phase === "run") { finish(); return; }
  renderStepper(); renderAsk(); renderGraph(); renderNarr(); renderTimeline(); renderSide();
}
function stop() { st.playing = false; clearTimeout(st.timer); if (st.result && st.phase === "run") renderAsk(); }
function tick() {
  if (!st.playing) return;
  if (st.idx >= last()) { finish(); return; }
  go(st.idx + 1);
  if (st.playing && st.phase === "run") st.timer = setTimeout(tick, 1700 / st.speed);
}
function resume() { st.playing = true; renderAsk(); st.timer = setTimeout(tick, 300); }
function launch() {
  clearTimeout(st.timer);
  st.phase = "run"; st.idx = -1; st.view = null; st.playing = true; st.follow = true; st.vb = null;
  renderAll(); scrollToEl("#graphCard");
  st.timer = setTimeout(tick, 500);
}
function finish() {
  st.playing = false; clearTimeout(st.timer);
  st.phase = "verdict"; st.idx = last(); st.view = null;
  renderAll(); $("#side").scrollTop = 0; award(); scrollToEl("#side");
}
function setParams(next, presetId, animate) {
  stop();
  st.before = st.result; st.params = next; st.preset = presetId; st.result = run(next);
  st.changedSteps = diffResults(st.before, st.result, SC().outcomeLabels ?? {}).changedSteps;
  st.view = null; st.vb = null; st.follow = true;
  if (animate) launch(); else { st.phase = "verdict"; st.idx = last(); renderAll(); $("#side").scrollTop = 0; award(); }
}
function applyPreset(id) {
  const p = SC().presets.find((x) => x.id === id);
  if (!p) return;
  setParams(resolveParams(SC(), p.params), p.id, true);
}
function openNode(id) { st.view = { type: "node", id }; renderGraph(); renderSide(); $("#side").scrollTop = 0; scrollToEl("#side"); }
function renderHead() {
  const e = st.entry, s = e.scenario, n = s.missions.filter((m) => done.has(m.id)).length;
  $("#scenHead").innerHTML = `<span style="display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--surface-2);border:2.5px solid var(--outline)">${icon({ hr: "data-protection", lake: "source", tools: "agent", finance: "source", crm: "actor", docs: "data-protection", invoice: "audit", model: "external" }[e.meta.icon] ?? "agent", 20)}</span>
    <h1>${esc(s.title)}</h1><q>${esc(s.customerRequest)}</q>
    <span class="acts"><button class="tb" type="button" id="hMissions">🏆 Défis ${n}/${s.missions.length}</button><button class="tb" type="button" id="hDrawer">⚙ Réglages avancés</button></span>`;
  $("#hMissions").onclick = () => { st.view = "missions"; renderSide(); scrollToEl("#side"); };
  $("#hDrawer").onclick = openDrawer;
}
function openScenario(id) {
  const e = SCENARIOS.find((x) => x.scenario.id === id);
  if (!e) { location.hash = ""; return; }
  if (st.entry !== e) {
    st.entry = e; st.preset = e.scenario.presets[0].id;
    st.params = resolveParams(e.scenario, e.scenario.presets[0].params);
    st.result = run(st.params); st.before = null; st.changedSteps = []; st.idx = -1; st.phase = "ask"; st.view = null; st.vb = null; st.follow = true;
  }
  renderHead(); renderAll();
}

// ---------------------------------------------------------------- Zoom, déplacement, plein écran
function zoom(f, cx, cy) {
  st.follow = false;
  const v = st.vb; cx ??= v.x + v.w / 2; cy ??= v.y + v.h / 2;
  const w = Math.min(Math.max(v.w * f, st.fit.w * 0.2), st.fit.w * 3), k = w / v.w;
  st.vb = { x: cx - (cx - v.x) * k, y: cy - (cy - v.y) * k, w, h: v.h * k }; applyViewBox();
}
function bindGraphGestures() {
  const svg = $("#graph");
  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = svg.getBoundingClientRect(), v = st.vb, s = Math.max(v.w / r.width, v.h / r.height);
    zoom(e.deltaY > 0 ? 1.12 : 1 / 1.12, v.x + (e.clientX - r.left) * s, v.y + (e.clientY - r.top) * s);
  }, { passive: false });
  let drag = null;
  svg.addEventListener("pointerdown", (e) => { if (e.target.closest("[data-node]")) return; drag = { x: e.clientX, y: e.clientY, vb: { ...st.vb } }; st.follow = false; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const r = svg.getBoundingClientRect(), s = Math.max(drag.vb.w / r.width, drag.vb.h / r.height);
    st.vb = { ...drag.vb, x: drag.vb.x - (e.clientX - drag.x) * s, y: drag.vb.y - (e.clientY - drag.y) * s }; applyViewBox();
  });
  svg.addEventListener("pointerup", () => { drag = null; });
  $("#zin").onclick = () => zoom(1 / 1.25);
  $("#zout").onclick = () => zoom(1.25);
  $("#zfit").onclick = () => { st.follow = true; st.vb = { ...st.fit }; renderGraph(); };
  $("#zfull").onclick = () => { const w = $("#graphWrap"); if (document.fullscreenElement) document.exitFullscreen?.(); else w.requestFullscreen?.().catch(() => {}); };
}

// ---------------------------------------------------------------- Navigation et thème
function route() {
  const id = location.hash.slice(1), onCanvas = SCENARIOS.some((e) => e.scenario.id === id);
  $("#gallery").hidden = onCanvas; $("#canvasView").hidden = !onCanvas;
  stop(); closeDrawer();
  if (onCanvas) openScenario(id); else renderGallery();
  scrollTo(0, 0);
}
function init() {
  $("#legend").innerHTML = `<span><b>Pastilles :</b></span>` + Object.keys(DEC).map((d) => `<span><i style="background:var(${DEC_VAR[d]})"></i>${DEC_GLYPH[d]} ${DEC[d]}</span>`).join("");
  $("#home").onclick = () => { location.hash = ""; };
  $("#drawerClose").onclick = closeDrawer;
  $("#drawer").addEventListener("click", (e) => { if (e.target.id === "drawer") closeDrawer(); });
  addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#drawer").hidden) closeDrawer(); });
  $("#theme").onclick = () => {
    const root = document.documentElement, dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
  };
  bindGraphGestures();
  addEventListener("hashchange", route);
  route();
}
init();
})();
</script>
</body>
</html>
